name: OrangeFox Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch (Android version)'
        required: true
        default: '12.1'
        type: choice
        options:
          - '14.1'
          - '12.1'
          - '11.0'
          - '10.0'
          - '9.0'
      DEVICE_TREE:
        description: 'Custom Recovery Tree (URL)'
        required: true
        default: 'https://github.com/DevCat3/android_device_samsung_gta4lve'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch (e.g. fox_12.1, fox_11.0, fox_9.0)'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Device path (e.g. device/samsung/gta4lve)'
        required: true
        default: 'device/samsung/gta4lve'
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'gta4lve'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      LDCHECK:
        description: 'Blob path to run ldcheck on (leave empty to skip)'
        required: false
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Also release recovery.tar (Samsung / Odin)'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Also release recovery-installer.zip'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build OFRP ${{ github.event.inputs.MANIFEST_BRANCH }} by ${{ github.actor }}
    # 22.04 on purpose: python2 / libncurses5 / libtinfo5 (needed by 9.0 & 10.0) are gone on 24.04
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USER_NAME: "DevCat3"
      USER_EMAIL: "omarelbakery2008@gmail.com"
      # Inputs are passed through env (never pasted into shell scripts) to avoid injection
      BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ github.event.inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}
      LDCHECK: ${{ github.event.inputs.LDCHECK }}
      RECOVERY_TAR: ${{ github.event.inputs.RECOVERY_TAR }}
      RECOVERY_INSTALLER: ${{ github.event.inputs.RECOVERY_INSTALLER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Branch Profile
        run: |
          # 9.0 / 10.0 -> legacy (omni makefile, python2, Java 8, no adbd target)
          # 11.0 / 12.1 / 14.1 -> modern (twrp makefile, Java 11, adbd target)
          case "$BRANCH" in
            9.0|10.0) LEGACY=true;  JAVA_VERSION=8  ;;
            11.0|12.1|14.1) LEGACY=false; JAVA_VERSION=11 ;;
            *) echo "::error::Unsupported OrangeFox branch: $BRANCH"; exit 1 ;;
          esac

          case "$BUILD_TARGET" in
            boot)       IMG_NAME=boot ;;
            recovery)   IMG_NAME=recovery ;;
            vendorboot) IMG_NAME=vendor_boot ;;
            *) echo "::error::Unsupported build target: $BUILD_TARGET"; exit 1 ;;
          esac

          DEVICE_TREE_URL="${DEVICE_TREE%.git}"

          {
            echo "LEGACY=$LEGACY"
            echo "JAVA_VERSION=$JAVA_VERSION"
            echo "IMG_NAME=$IMG_NAME"
            echo "DEVICE_TREE_URL=$DEVICE_TREE_URL"
            echo "BUILD_DATE=$(date +%Y%m%d)"
            echo "FOX_DIR=${GITHUB_WORKSPACE}/OrangeFox/fox_${BRANCH}"
          } >> "$GITHUB_ENV"

          echo "::group::Build configuration"
          echo "OrangeFox branch : $BRANCH (legacy=$LEGACY, java=$JAVA_VERSION)"
          echo "Device           : $DEVICE_NAME ($DEVICE_PATH)"
          echo "Device tree      : $DEVICE_TREE @ $DEVICE_TREE_BRANCH"
          echo "Target           : ${BUILD_TARGET}image"
          echo "::endgroup::"

      - name: Clean-up Runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Build Environment
        run: |
          sudo apt-get update
          sudo apt-get -y upgrade
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Legacy Dependencies (9.0 / 10.0)
        if: env.LEGACY == 'true'
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get -y install python2 libncurses5 libtinfo5 libstdc++-10-dev gcc-10 g++-10 gcc-10-multilib g++-10-multilib
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Sync OrangeFox Sources
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
          cd "${GITHUB_WORKSPACE}/OrangeFox"
          git config --global user.name "$USER_NAME"
          git config --global user.email "$USER_EMAIL"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch "$BRANCH" --path "$FOX_DIR"

      - name: Clone Device Tree
        run: |
          cd "$FOX_DIR"
          git clone "$DEVICE_TREE" -b "$DEVICE_TREE_BRANCH" "./$DEVICE_PATH"
          echo "COMMIT_ID=$(git -C "./$DEVICE_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Detect Device Makefile
        run: |
          cd "$FOX_DIR"
          # Prefer the makefile that matches the branch, but accept the other one too
          if [ "$LEGACY" = "true" ]; then ORDER="omni twrp fox"; else ORDER="twrp omni fox"; fi
          for prefix in $ORDER; do
            if [ -f "$DEVICE_PATH/${prefix}_${DEVICE_NAME}.mk" ]; then
              echo "Found ${prefix}_${DEVICE_NAME}.mk"
              echo "DEVICE_MAKEFILE=${prefix}_${DEVICE_NAME}" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No twrp_/omni_/fox_${DEVICE_NAME}.mk found in $DEVICE_PATH"
          ls -la "$DEVICE_PATH"
          exit 1

      - name: Build OrangeFox
        run: |
          cd "$FOX_DIR"
          set +e
          source build/envsetup.sh
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true

          # Android 14 (14.1) may need a release suffix in the lunch combo, so try a few
          LUNCHED=false
          for variant in eng ap2a-eng trunk_staging-eng; do
            if lunch "${DEVICE_MAKEFILE}-${variant}"; then LUNCHED=true; break; fi
          done
          if [ "$LUNCHED" != "true" ]; then
            echo "::error::lunch failed for ${DEVICE_MAKEFILE}"
            exit 1
          fi

          if [ "$LEGACY" = "true" ]; then
            mka "${BUILD_TARGET}image"
          else
            mka adbd "${BUILD_TARGET}image"
          fi

      - name: Collect Build Output
        run: |
          OUT="${FOX_DIR}/out/target/product/${DEVICE_NAME}"
          [ -d "$OUT" ] || { echo "::error::Output dir not found: $OUT"; exit 1; }

          mkdir -p "$GITHUB_WORKSPACE/release"
          cd "$OUT"

          # OrangeFox names its image OrangeFox-<ver>-<date>-<device>.img
          FOX_IMG=$(find . -maxdepth 1 -name 'OrangeFox*.img' | head -n1)
          if [ -z "$FOX_IMG" ]; then
            # Fallback to the plain AOSP name
            FOX_IMG="./${IMG_NAME}.img"
          fi
          [ -f "$FOX_IMG" ] || { echo "::error::No recovery image produced"; ls -la; exit 1; }

          cp "$FOX_IMG" "$GITHUB_WORKSPACE/release/${IMG_NAME}.img"
          echo "MD5_IMG=$(md5sum "$FOX_IMG" | cut -d ' ' -f1)" >> "$GITHUB_ENV"

          # Flashable OrangeFox zip(s), if the build made them
          find . -maxdepth 1 -name 'OrangeFox*.zip' -exec cp {} "$GITHUB_WORKSPACE/release/" \;
          # ramdisk (useful for vendor_boot / A-only boot repacking)
          find . -maxdepth 1 -name 'ramdisk-recovery.*' -exec cp {} "$GITHUB_WORKSPACE/release/" \;

          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"
          ls -la "$GITHUB_WORKSPACE/release"

      - name: Create Samsung TAR
        if: env.RECOVERY_TAR == 'true'
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE/release"
          tar -H ustar -cvf "${IMG_NAME}.tar" "${IMG_NAME}.img"

      - name: Create Recovery Installer
        if: env.RECOVERY_INSTALLER == 'true'
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE/release"
          wget -q https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
          zip -ur recovery-installer.zip "${IMG_NAME}.img"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: Unofficial OrangeFox ${{ env.BRANCH }} for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ofrp-${{ env.BRANCH }}-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          body: |
            ## Build Information
            - **OrangeFox:** ${{ env.BRANCH }}
            - **Target:** ${{ env.BUILD_TARGET }}image (`${{ env.IMG_NAME }}.img`)
            - **Device Tree:** [${{ env.DEVICE_TREE_BRANCH }}](${{ env.DEVICE_TREE_URL }}/tree/${{ env.DEVICE_TREE_BRANCH }})
            - **Commit:** [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
            - **MD5 (img):** `${{ env.MD5_IMG }}`
            - **Built by:** ${{ github.actor }}

            Samsung: flash the `.tar` with Odin. Others: flash the `.img` with fastboot.

      - name: Run LDCheck
        if: env.LDCHECK != ''
        continue-on-error: true
        run: |
          ROOT="${OUT_DIR}/recovery/root"
          if [ -f tools/libneeds ] && [ -f tools/ldcheck ] && [ -d "$ROOT" ]; then
            cp -n tools/libneeds tools/ldcheck "$ROOT/"
            cd "$ROOT"
            python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d "$LDCHECK"
            echo "Done checking missing dependencies. Review and reconfigure your tree."
          else
            echo "ldcheck tools (tools/libneeds, tools/ldcheck) or recovery/root not found, skipping."
          fi
